<html>
  <head>
    <title>Almuruj Game</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.2.0/dist/leaflet.css"> 
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    
    <!-- The rest of the app goes here -->
    <div id="app" class="container col-md-12">

      <div class="row">
        
        <div class="col-md-9">  
          <!-- map is displayed here-->
          <div id="map" class="map">
          </div>
        </div>

        <!-- toggle bar is displayed here-->
        <div class="col-md-3">  
          <h1> Customize Building </h1>
          <div id="toggle" class="controlpanel">   
            <div class="controlrow">
              <input type="checkbox" id="toggleHP"> 
              <label for="toggleHP">HP</label>
            </div> 
            <div class="controlrow">
              <input type="checkbox" id="toggleWater"> 
              <label for="toggleWater">Water</label>
            </div>
            <div class="controlrow">
              <input type="checkbox" id="toggleGreenery"> 
              <label for="toggleGreenery">Greenery</label>
            </div>
            <div class="controlrow">
              <input type="range" min="0" max="100" value="50" class="slider"
              id="toggleFood" name="toggleFood">
              <label for="toggleFood" >Food %</label>
            </div>
            <div class="controlrow">
              <input type="range" min="0" max="100" value="50" class="slider"
              id="togglePV" name="togglePV">
              <label for="togglePV">PV %</label>
            </div>
              <div class = "col col-lg-2">
<div class="controlpanel">   
<div><label class="switch">
  <input type="checkbox" id="toggleHP">
  <span class="toggle round"></span>
</label></div> 
    <br>    
<div><label class="switch">
  <input type="checkbox" id="toggleWater">
  <span class="toggle round"></span>
</label></div>
    <br>
<div><label class="switch">
  <input type="checkbox" id="toggleGreen">
  <span class="toggle round"></span>
</label></div>
    <br>
<div class="slidecontainer">
  <input type="range" min="0" max="100" value="50" class="slider" id="myRange1">
<!--<span id="demo1"></span>-->
</div>
    <br>
<div class="slidecontainer">
  <input type="range" min="0" max="100" value="50" class="slider" id="myRange2">
<!--<span id="demo2"></span>-->
</div>
          </div>
        </div>
      </div>
<div class="row">    
<div class="resultspanel">
 <svg id="CO2" width="100" height="100">
 <!--<text x="35" y=70 text-anchor="middle">CO2 Emissions</text>-->
 <circle cx="50" cy="25" r="25" fill="#A3E4D7"/>
 </svg>
<svg id="Cost" width="100" height="100">
 <circle cx="50" cy="25" r="25" fill="#48C9B0"/>
 <text>Cost</text>
 </svg>
<svg id="Food" width="100" height="100">
 <circle cx="50" cy="25" r="25" fill="#17A589"/>
 <text>Food %</text>
 </svg>
<svg id="Job" width="100" height="100">
 <circle cx="50" cy="25" r="25" fill="#117864"/>
 <text>Jobs Created</text>
 
 </svg>
</div>
    </div>
      <div class="row" id="calculations">

        <!-- CO2 results -->
        <div class="col=sm-4 col-md-2" id="CO2">  
          <span class="dot"></span>
          <div class="resultval" id="co2val"> Placeholder </div>
          <div class="units"> units </div>
          <div class="resultname"> CO2 </div>
        </div>

        <!-- Cost results -->
        <div class="col-sm-4 col-md-2" id="Water">  
          <span class="dot"></span>
          <div class="resultval" id="waterval"> Placeholder </div>
          <div class="units"> units </div>
          <div class="resultname"> Water </div>
        </div>

        <!-- Jobs results -->
        <div class="col-sm-4 col-md-2" id="Jobs">  
          <span class="dot"></span>
          <div class="resultval" id="jobsval"> Placeholder </div>
          <div class="units"> units </div>
          <div class="resultname"> Jobs </div>
        </div>

        <div class="col-sm-4 col-md-2" id="Energy">  
          <span class="dot"></span>
          <div class="resultval" id="energyval"> Placeholder </div>
          <div class="units"> units </div>
          <div class="resultname"> Energy </div>
        </div>
        
        <div class="col-sm-4 col-md-2" id="Cost">  
          <span class="dot"></span>
          <div class="resultval" id="costval"> Placeholder </div>
          <div class="units"> units </div>
          <div class="resultname"> Cost </div>
        </div>
        
        <div class="col-sm-4 col-md-2" id="other">  
          <span class="dot"></span>
          <div class="resultval" id="otherval"> Placeholder </div>
          <div class="units"> units </div>
          <div class="resultname"> Other </div>
        </div>
      </div> <!-- end results row -->

    </div>

    <!-- Include vue, leaflet, and our custom javascript-->
    <script src="https://cdn.jsdelivr.net/npm/vue"></script>
    <script src="https://unpkg.com/leaflet@1.2.0/dist/leaflet.js"></script>

    <script src="res.js"></script>
    <script src="com.js"></script>
    <script src="index.js"></script>
  </body>
</html>
