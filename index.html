<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="MIT Sustainable Design Lab">
        <link rel="icon" href="img/favicon.ico">

        <title>Almuruj Game</title>

        <link href="css/bootstrap.min.css" rel="stylesheet">
        <link href="css/dashboard.css" rel="stylesheet">
        <link href="css/jquery.range.css" rel="stylesheet">

        <link href="css/custom.css" rel="stylesheet">
        <script src="https://d3js.org/d3.v5.min.js"></script>
        <script src=https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.11/lodash.core.js></script>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
    <!--Container-->
        <div class="container-fluid">
          <div class="container-fluid" id= "container" style="width:100%; height:490px;">
        </div>
        
        <div class="container">
<div class="row">
<div class = "col-sm">
<div id="neighborhoodmap"></div>
</div>
<div class = "col col-lg-2">
<div class="controlpanel">   
<div><label class="switch">
  <input type="checkbox" id="toggleHP">
  <span class="toggle round"></span>
</label></div> 
    <br>    
<div><label class="switch">
  <input type="checkbox" id="toggleWater">
  <span class="toggle round"></span>
</label></div>
    <br>
<div><label class="switch">
  <input type="checkbox" id="toggleGreen">
  <span class="toggle round"></span>
</label></div>
    <br>
<div class="slidecontainer">
  <input type="range" min="0" max="100" value="50" class="slider" id="myRange1">
<!--<span id="demo1"></span>-->
</div>
    <br>
<div class="slidecontainer">
  <input type="range" min="0" max="100" value="50" class="slider" id="myRange2">
<!--<span id="demo2"></span>-->
</div>
     <br>
</div>
</div>
</div>
<div class="row">    
<div class="resultspanel">
 <svg id="CO2" width="100" height="100">
 <!--<text x="35" y=70 text-anchor="middle">CO2 Emissions</text>-->
 <circle cx="50" cy="25" r="25" fill="#A3E4D7"/>
 </svg>
<svg id="Cost" width="100" height="100">
 <circle cx="50" cy="25" r="25" fill="#48C9B0"/>
 <text>Cost</text>
 </svg>
<svg id="Food" width="100" height="100">
 <circle cx="50" cy="25" r="25" fill="#17A589"/>
 <text>Food %</text>
 </svg>
<svg id="Job" width="100" height="100">
 <circle cx="50" cy="25" r="25" fill="#117864"/>
 <text>Jobs Created</text>
 
 </svg>
</div>
    </div>
</div>
    

        <script src="bin/jquery-2.1.1.min.js"></script>
        <script src="bin/jquery.range.js"></script>
        <script type="text/javascript" src="bin/highcharts.js"></script>
        <script type="text/javascript" src="bin/highcharts-more.src.js"></script>
        <script type="text/javascript" src="bin/map.js"></script>
        <script type="text/javascript" src="bin/map.src.js"></script>
        <script type="text/javascript" src="bin/data.js"></script>
        <script type="text/javascript" src="bin/drilldown.js"></script>
        <script type="text/javascript" src="css/bootstrap.min.js"></script>
        <script type="text/javascript" src="bin/exporting.js"></script>
        <script type="text/javascript" src="example.json"></script>
        <script type="text/javascript" src="js/script.js?v=2"></script>
        <script src="https://highcharts.github.io/pattern-fill/pattern-fill-v2.js"></script>
    </body>
</html>
